<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="newChatButton" data-i18n-title="ui.newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-button" id="historyButton" data-i18n-title="ui.history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
    <div class="topbar-spacer"></div>
    <button class="icon-button" id="cleanupButton" data-i18n-title="ui.cleanup">
      <svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
    </button>
    <button class="icon-button" id="settingsButton" data-i18n-title="ui.settings">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <!-- Chat -->
  <main class="view" id="chatView">
    <div class="messages" id="messageList"></div>
    <div class="empty-state" id="emptyState">
      <p class="empty-title" data-i18n="empty.title"></p>
      <button class="soft-button" id="summarizeButton" data-i18n="empty.summarize"></button>
      <button class="soft-button" id="compareButton" data-i18n="empty.compare"></button>
      <button class="soft-button" id="priceButton" data-i18n="empty.price"></button>
      <button class="soft-button" id="overviewButton" data-i18n="empty.overview"></button>
      <p class="hint empty-hint">
        <kbd>/</kbd> <span data-i18n="empty.hintCommands"></span> · <kbd>@</kbd> <span data-i18n="empty.hintTabs"></span> · <span data-i18n="empty.hintImage"></span>
      </p>
    </div>
  </main>

  <!-- Verlauf -->
  <section class="view" id="historyView" hidden>
    <div class="view-header">
      <h2 data-i18n="ui.history"></h2>
      <button class="text-button" data-close-view data-i18n="ui.close"></button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </section>

  <!-- Einstellungen -->
  <section class="view" id="settingsView" hidden>
    <div class="view-header">
      <h2 data-i18n="ui.settings"></h2>
      <span class="hint" id="settingsSaved"></span>
      <button class="text-button" data-close-view data-i18n="ui.close"></button>
    </div>
    <p class="notice" id="settingsNotice" hidden></p>

    <h3 data-i18n="settings.modelSection"></h3>
    <div class="group">
      <label class="field">
        <span data-i18n="settings.apiKey"></span>
        <div class="key-row">
          <input type="password" id="apiKeyInput" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
          <button class="text-button" id="toggleKeyButton" type="button"></button>
        </div>
        <small><span data-i18n="settings.keyHint"></span> <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com</a></small>
      </label>
      <label class="row">
        <span data-i18n="settings.defaultModel"></span>
        <select id="defaultModelSelect"></select>
      </label>
      <label class="row">
        <span data-i18n="settings.effort"></span>
        <select id="defaultEffortSelect"></select>
      </label>
      <small class="hint" data-i18n="settings.effortHint"></small>
    </div>

    <h3 data-i18n="settings.general"></h3>
    <div class="group">
      <label class="row">
        <span data-i18n="settings.language"></span>
        <select id="languageSelect">
          <option value="auto" data-i18n="settings.auto"></option>
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="row">
        <span data-i18n="settings.appearance"></span>
        <select id="appearanceSelect">
          <option value="auto" data-i18n="settings.auto"></option>
          <option value="light" data-i18n="settings.light"></option>
          <option value="dark" data-i18n="settings.dark"></option>
        </select>
      </label>
      <label class="row">
        <span data-i18n="settings.background"></span>
        <span class="row-controls">
          <input type="color" id="backgroundColorInput" value="#1b1b1d" hidden>
          <select id="backgroundModeSelect">
            <option value="auto" data-i18n="settings.bgAuto"></option>
            <option value="custom" data-i18n="settings.bgCustom"></option>
          </select>
        </span>
      </label>
      <small class="hint" data-i18n="settings.bgHint"></small>
    </div>

    <h3 data-i18n="settings.behaviour"></h3>
    <div class="group">
      <label class="row">
        <span data-i18n="settings.webSearch"></span>
        <input type="checkbox" class="switch" id="webSearchCheckbox">
      </label>
      <label class="row">
        <span data-i18n="settings.region"></span>
        <select id="regionSelect">
          <option value="ch" data-i18n="settings.regionCh"></option>
          <option value="de" data-i18n="settings.regionDe"></option>
          <option value="at" data-i18n="settings.regionAt"></option>
          <option value="eu" data-i18n="settings.regionEu"></option>
        </select>
      </label>
      <label class="row">
        <span data-i18n="settings.confirm"></span>
        <input type="checkbox" class="switch" id="confirmChangesCheckbox">
      </label>
      <small class="hint" data-i18n="settings.closeAlways"></small>
    </div>

    <h3 data-i18n="settings.sidebar"></h3>
    <div class="group">
      <div class="row">
        <span data-i18n="settings.shortcut"></span>
        <span class="row-controls">
          <kbd id="shortcutLabel"></kbd>
          <button class="text-button" id="shortcutButton" type="button" data-i18n="settings.changeShortcut"></button>
        </span>
      </div>
      <small class="hint" data-i18n="settings.shortcutHint"></small>
      <div class="row">
        <span data-i18n="settings.header"></span>
        <button class="text-button" id="copyCssButton" type="button" data-i18n="settings.copyCss"></button>
      </div>
      <small class="hint" data-i18n="settings.headerHint"></small>
    </div>

    <h3 data-i18n="settings.personal"></h3>
    <div class="group">
      <label class="field">
        <span data-i18n="settings.commands"></span>
        <textarea id="customCommandsInput" rows="4" spellcheck="false" data-i18n-placeholder="settings.commandsPlaceholder"></textarea>
        <small data-i18n="settings.commandsHint"></small>
      </label>
    </div>

    <h3 data-i18n="settings.usage"></h3>
    <div class="group">
      <div class="row">
        <span data-i18n="settings.usageMonth"></span>
        <span class="row-value" id="usageMonth"></span>
      </div>
      <div class="row">
        <span data-i18n="settings.usageTotal"></span>
        <span class="row-value" id="usageTotal"></span>
      </div>
      <small class="hint"><span data-i18n="settings.usageHint"></span> <a href="https://console.anthropic.com/usage" target="_blank" rel="noopener noreferrer">console.anthropic.com</a></small>
    </div>

    <h3 data-i18n="settings.update"></h3>
    <div class="group">
      <div class="row">
        <span id="versionLabel"></span>
        <button class="text-button" id="updateButton" type="button" data-i18n="settings.checkUpdate"></button>
      </div>
      <small class="hint" id="updateStatus" data-i18n="settings.updateHint"></small>
    </div>

    <h3 data-i18n="settings.data"></h3>
    <div class="group">
      <p class="hint" data-i18n="settings.privacy"></p>
      <button class="danger-button" id="clearHistoryButton" type="button"></button>
    </div>
  </section>

  <!-- Eingabe -->
  <footer class="composer" id="composer">
    <div class="context-row" id="contextRow">
      <button class="chip chip-toggle" id="pageChip" aria-pressed="true">
        <span class="chip-dot"></span><span class="chip-label" id="pageChipLabel"></span>
      </button>
      <span id="extraTabChips"></span>
      <button class="chip chip-add" id="addTabsButton" data-i18n="chip.addTabs" data-i18n-title="chip.addTabsTitle"></button>
    </div>
    <div class="tab-picker" id="tabPicker" hidden>
      <input type="search" id="tabPickerSearch" data-i18n-placeholder="picker.filter">
      <ul id="tabPickerList"></ul>
    </div>
    <ul class="suggest-box" id="suggestBox" hidden></ul>
    <div class="input-box">
      <textarea id="promptInput" rows="1" data-i18n-placeholder="input.placeholder"></textarea>
      <button class="send-button" id="sendButton">
        <svg viewBox="0 0 24 24" class="icon-send"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        <svg viewBox="0 0 24 24" class="icon-stop"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
    <div class="composer-meta">
      <button class="icon-button small" id="uploadButton" type="button" data-i18n-title="input.upload">
        <svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <button class="icon-button small" id="screenshotButton" type="button" data-i18n-title="input.screenshot">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      </button>
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.pdf,text/*,.md,.csv,.json,.txt" hidden>
      <select id="modelSelect" data-i18n-title="ui.model"></select>
      <select id="effortSelect" data-i18n-title="ui.effort"></select>
      <span class="usage" id="usageLabel"></span>
    </div>
  </footer>
  <div class="drop-overlay" id="dropOverlay" data-i18n="drop.here" hidden></div>

  <script src="i18n.js"></script>
  <script src="markdown.js"></script>
  <script src="api.js"></script>
  <script src="shop.js"></script>
  <script src="tabs.js"></script>
  <script src="tools.js"></script>
  <script src="panel.js"></script>
</body>
</html>
