# Signiert jede neue Version bei Mozilla (privat/unlisted), legt ein GitHub-Release an
# und trägt sie in updates.json ein. Zen holt sich das Update dann automatisch.
# Auslöser: Änderung an manifest.json auf main (neue Versionsnummer) oder manuell.
name: Signieren und veröffentlichen

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version lesen
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob die Version schon veröffentlicht ist
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.version.outputs.value }} gibt es schon, nichts zu tun."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bei Mozilla signieren (unlisted)
        if: steps.exists.outputs.skip == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --channel=unlisted \
            --source-dir . \
            --artifacts-dir dist \
            --approval-timeout 900000 \
            --ignore-files ".github/**" "scripts/**" "dist/**" "updates.json" "*.zip" "*.xpi"
          mv dist/*.xpi "dist/claude-sidebar-${{ steps.version.outputs.value }}.xpi"

      - name: GitHub-Release anlegen
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "v$VERSION" "dist/claude-sidebar-$VERSION.xpi" \
            --title "Claude Sidebar $VERSION" \
            --notes "Signiert von Mozilla. Zen aktualisiert installierte Versionen automatisch."

      - name: updates.json aktualisieren
        if: steps.exists.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          node scripts/add-update.js "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/v$VERSION/claude-sidebar-$VERSION.xpi"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json: $VERSION"
          git push
